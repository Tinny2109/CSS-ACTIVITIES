<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>goal9</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            color: #fff;
            font-size: 30px;
        }
        h1{
            padding: 20px;
            color: #000;
            font-size: 50px;
        }
        .parent{
            padding: 20px;
            display: flex;
            justify-content: flex-start;
            flex-direction: column;
        }
        .child1{
            background-color: red;
            min-height: 350px;
            height: 300px;
            max-width:350px;
            width: 300px;
        }
        .child2{
            background-color: green;
            min-height: 350px;
            height: 300px;
            max-width:350px;
            width: 300px;
            margin-top: 20px;
        }
        .child3{
            background-color: blue;
            min-height: 350px;
            height: 300px;
            max-width:350px;
            width: 300px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>CSS Display Property</h1>
    <div class="parent">
        <div class="child1">
            <p value="red">Red Paragraph</p>
        </div>
        <div class="child2">
            <p value="green">Green Paragraph</p>
        </div>
        <div class="child3">
            <p value="blue">Blue Paragraph</p>
        </div>
    </div>
</body>
</html>
