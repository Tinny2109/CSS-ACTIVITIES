<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>goal6</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        .parent{
            max-width: 100%;
            width: 95%;
            background-color: #9006ac;
            margin: 20px;
            padding: 10px;
        }
        .child{
            max-width: 100%;
            background-color: #262080;
            width: 100%;
            padding: 40px;
        }
        p{
            font-size: 40px;
        }
        p[value="Yellow"]{
            color: yellow;
        }
        p[value="White"]{
            color: white;
            background-color: red;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child">
            <p value="Yellow">Yellow Text</p>
            <p value="White">White Text</p><br><br><br>
            <p value="Yellow">Yellow Text</p>
            <p value="White">White Text</p>
        </div>
    </div>
</body>
</html>
