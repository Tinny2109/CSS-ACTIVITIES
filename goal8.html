<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>goal8</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .card{
            position: relative;
            display: flex;
            justify-content: center;
            margin-top: 200px;
            margin-left: 200px;
        }
        .box{
            background-color: blue;
            height: 300px;
            width: 500px;
        }
        .circle1{
            position: relative;
            display: flex;
            justify-content: flex-start;
            margin-top: 150px;
            margin-left: 250px;
        }
        .circle{
            background-color: red;
            min-height: 180px;
            height: 170px;
            max-width: 180px;
            width: 176px;
            border-radius: 50%;
        }

    </style>
</head>
<body>
    <div class="card">
        <div class="box">
            <div class="circle1">
                <div class="circle">

                </div>
            </div>
        </div>
    </div>
</body>
</html>
